name: ciweimao-api-reverse

services:
  egress:
    image: ciweimao-api-reverse:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    command:
      - ssh
      - -NT
      - -D
      - 0.0.0.0:1080
      - -p
      - "44001"
      - -i
      - /home/app/.ssh/id_rsa
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/home/app/.ssh/known_hosts
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - ServerAliveCountMax=3
      - root@211.144.221.229
    restart: unless-stopped
    init: true
    volumes:
      - ./runtime/ssh/id_rsa:/home/app/.ssh/id_rsa:ro
      - ./runtime/ssh/known_hosts:/home/app/.ssh/known_hosts:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    mem_reservation: 32m
    cpus: 0.15
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(('127.0.0.1', 1080), timeout=5).close()
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    labels:
      com.zhangxuemin.project: ciweimao-api-reverse
      com.zhangxuemin.role: isolated-ssh-egress

  api:
    image: ciweimao-api-reverse:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    init: true
    depends_on:
      egress:
        condition: service_healthy
    env_file:
      - ./runtime/app.env
    environment:
      CIWEIMAO_HOST: 0.0.0.0
      CIWEIMAO_PORT: "8000"
      CIWEIMAO_DB_PATH: /app/data/ciweimao.sqlite3
      CIWEIMAO_OUTPUT_DIR: /app/output_api
      CIWEIMAO_SCHEDULER_ENABLED: "1"
      CIWEIMAO_QUEUE_WORKERS: "1"
      CIWEIMAO_PROXY_URL: socks5://egress:1080
      TZ: Asia/Shanghai
    ports:
      - "${CIWEIMAO_BIND_IP:-127.0.0.1}:${CIWEIMAO_HOST_PORT:-18086}:8000"
    volumes:
      - ./runtime/data:/app/data
      - ./runtime/output:/app/output_api
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    mem_reservation: 128m
    cpus: 0.75
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.zhangxuemin.project: ciweimao-api-reverse
      com.zhangxuemin.role: app-api-collector
